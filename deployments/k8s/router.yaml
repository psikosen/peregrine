apiVersion: v1
kind: ConfigMap
metadata:
  name: router-config
  namespace: peregrine
data:
  OLLAMA_ENDPOINT: "http://ollama:11434"
  OLLAMA_MODEL: "gemma3:270m"
  NGROK_ENDPOINT: "https://ai-gateway.ngrok.io"
  NGROK_MODEL: "claude-3-sonnet"
---
apiVersion: v1
kind: Secret
metadata:
  name: router-secrets
  namespace: peregrine
type: Opaque
stringData:
  NGROK_API_KEY: ""  # Set this in your deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-router
  namespace: peregrine
  labels:
    app: llm-router
    component: router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-router
  template:
    metadata:
      labels:
        app: llm-router
        component: router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: router
          image: peregrine-router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: router-config
            - secretRef:
                name: router-secrets
          args:
            - "--grpc-port=50051"
            - "--metrics-port=9090"
            - "--health-interval=10s"
            - "--health-failure-threshold=3"
            - "--health-recovery-time=30s"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: llm-router
  namespace: peregrine
  labels:
    app: llm-router
spec:
  type: ClusterIP
  selector:
    app: llm-router
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llm-router-pdb
  namespace: peregrine
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llm-router
